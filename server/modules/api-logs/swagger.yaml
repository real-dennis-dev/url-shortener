openapi: 3.0.0
info:
  title: API Logs Module
  version: 1.0.0
  description: API Logs Management Module Documentation

paths:
  /api/v1/logs:
    get:
      summary: Get API Logs
      description: Retrieve API request logs with filtering and pagination
      tags: [API Logs]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter logs from this date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter logs up to this date
        - in: query
          name: method
          schema:
            type: string
            enum: [GET, POST, PUT, DELETE, PATCH]
          description: Filter by HTTP method
        - in: query
          name: statusCode
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: Filter by status code
        - in: query
          name: endpoint
          schema:
            type: string
          description: Filter by endpoint (partial match)
        - in: query
          name: minResponseTime
          schema:
            type: integer
            minimum: 0
          description: Minimum response time in milliseconds
        - in: query
          name: maxResponseTime
          schema:
            type: integer
            minimum: 0
          description: Maximum response time in milliseconds
        - in: query
          name: search
          schema:
            type: string
          description: Search in request/response body and endpoint
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Items per page
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, responseTime, statusCode]
            default: createdAt
          description: Sort field
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          description: Sort order
      responses:
        200:
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: "#/components/schemas/ApiLog"
                      total:
                        type: integer
                      page:
                        type: integer
                      totalPages:
                        type: integer
                      limit:
                        type: integer
        400:
          description: Validation error
        401:
          description: Unauthorized

  /api/v1/logs/{id}:
    get:
      summary: Get Log Details
      description: Retrieve detailed information about a specific log entry
      tags: [API Logs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Log ID
      responses:
        200:
          description: Log details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ApiLogDetail"
        401:
          description: Unauthorized
        403:
          description: Access denied
        404:
          description: Log not found

  /api/v1/logs/stats:
    get:
      summary: Get Log Statistics
      description: Retrieve aggregated log statistics
      tags: [API Logs]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Statistics from this date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Statistics up to this date
      responses:
        200:
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/LogStats"
        401:
          description: Unauthorized

  /api/v1/logs/export:
    get:
      summary: Export Logs
      description: Export logs in specified format (CSV, Excel, JSON)
      tags: [API Logs]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, excel, json]
            default: json
          description: Export format
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter logs from this date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter logs up to this date
        - in: query
          name: method
          schema:
            type: string
            enum: [GET, POST, PUT, DELETE, PATCH]
          description: Filter by HTTP method
        - in: query
          name: statusCode
          schema:
            type: integer
            minimum: 100
            maximum: 599
          description: Filter by status code
      responses:
        200:
          description: Logs exported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                      format:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
        400:
          description: Validation error
        401:
          description: Unauthorized

  /api/v1/logs/summary:
    get:
      summary: Get User Log Summary
      description: Get quick summary of user's API usage
      tags: [API Logs]
      security:
        - bearerAuth: []
      responses:
        200:
          description: User log summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/UserLogSummary"
        401:
          description: Unauthorized

  /api/v1/logs/clean:
    delete:
      summary: Clean Old Logs
      description: Delete logs older than specified days (admin only)
      tags: [API Logs]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 365
          description: Number of days to keep
      responses:
        200:
          description: Old logs cleaned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                      daysKept:
                        type: integer
                      cutoffDate:
                        type: string
                        format: date-time
        401:
          description: Unauthorized
        403:
          description: Insufficient permissions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: integer
          nullable: true
        api_key:
          type: string
          nullable: true
        endpoint:
          type: string
        method:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH]
        status_code:
          type: integer
        response_time:
          type: integer
        ip_address:
          type: string
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user_email:
          type: string
          nullable: true
        user_name:
          type: string
          nullable: true

    ApiLogDetail:
      allOf:
        - $ref: "#/components/schemas/ApiLog"
        - type: object
          properties:
            request_body:
              type: object
              nullable: true
            response_body:
              type: object
              nullable: true

    LogStats:
      type: object
      properties:
        overview:
          type: object
          properties:
            totalRequests:
              type: integer
            uniqueUsers:
              type: integer
            successRate:
              type: number
              format: float
            avgResponseTime:
              type: number
              format: float
            minResponseTime:
              type: integer
            maxResponseTime:
              type: integer
            errors:
              type: object
              properties:
                clientErrors:
                  type: integer
                serverErrors:
                  type: integer
        topEndpoints:
          type: array
          items:
            type: object
            properties:
              endpoint:
                type: string
              method:
                type: string
              count:
                type: integer
              avg_response_time:
                type: number
                format: float
              max_status_code:
                type: integer
        statusDistribution:
          type: array
          items:
            type: object
            properties:
              status_code:
                type: integer
              count:
                type: integer
        dailyData:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
              avgResponseTime:
                type: number
                format: float

    UserLogSummary:
      type: object
      properties:
        userId:
          type: integer
        totalRequests:
          type: integer
        activeDays:
          type: integer
        avgResponseTime:
          type: number
          format: float
        lastRequest:
          type: string
          format: date-time
          nullable: true

tags:
  - name: API Logs
    description: API request logging and monitoring
